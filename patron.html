<div id="app">

<script>
const FIREBASE_URL = "https://caissex-3d4cc-default-rtdb.europe-west1.firebasedatabase.app";
let courses = [];
let tabActif = "jour";
let dateFiltre = today();

const APPS = [
  { val:"compteur", label:"🚕 Compteur", color:"#fbbf24" },
  { val:"bolt",     label:"⚡ Bolt",      color:"#34d399" },
  { val:"heetch",   label:"🟣 Heetch",    color:"#f472b6" },
  { val:"uber",     label:"⬛ Uber",      color:"#94a3b8" },
  { val:"taxisvert",label:"🟢 Taxis Verts",color:"#4ade80" },
];

function today() {
  const now = new Date();
  if (now.getHours() < 8) {
    const h = new Date(now); h.setDate(now.getDate()-1);
    return ds(h);
  }
  return ds(now);
}
function ds(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function dfr(s) {
  const [y,m,d] = s.split("-");
  return `${d}/${m}/${y}`;
}
function formatEuro(n) {
  return new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR"}).format(n||0);
}
function paiementColor(p) {
  return p==="espèces"?"#4ade80":p==="carte"?"#60a5fa":"#facc15";
}
function appInfo(a) {
  return APPS.find(x=>x.val===a)||APPS[0];
}
function totaux(liste) {
  return liste.reduce((acc,c)=>{
    const m=parseFloat(c.montant)||0;
    acc.total+=m; acc.nb++;
    if(c.paiement==="espèces") acc.especes+=m;
    else if(c.paiement==="carte") acc.carte+=m;
    else acc.autre+=m;
    return acc;
  },{total:0,especes:0,carte:0,autre:0,nb:0});
}
function appTotaux(liste) {
  const res={};
  APPS.forEach(a=>res[a.val]=liste.filter(c=>(c.appli||"compteur")===a.val).reduce((s,c)=>s+(parseFloat(c.montant)||0),0));
  return res;
}

// Grouper les courses par journée de shift (19h → 8h)
function getShiftDate(c) {
  const h = parseInt((c.heure||"00").split(":")[0]);
  if (h < 8) {
    // appartient à la journée de la veille
    const parts = c.date.split("-");
    const d = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
    d.setDate(d.getDate()-1);
    return ds(d);
  }
  return c.date;
}

function groupByShift(liste) {
  const map = {};
  liste.forEach(c => {
    const sd = getShiftDate(c);
    if (!map[sd]) map[sd] = [];
    map[sd].push(c);
  });
  return map;
}

function getSemaine() {
  const now = new Date();
  const day = now.getDay();
  const diff = day===0?-6:1-day;
  const lun = new Date(now); lun.setDate(now.getDate()+diff);
  const dim = new Date(lun); dim.setDate(lun.getDate()+6);
  return courses.filter(c=>c.date>=ds(lun)&&c.date<=ds(dim));
}
function getMois() {
  const now = new Date();
  const ms = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;
  return courses.filter(c=>c.date.startsWith(ms));
}

function render() {
  const tJour = totaux(courses.filter(c=>c.date===dateFiltre));

            </div>`;
          }).join("")}
        </div>
      </div>`;

      // Répartition apps du jour
      html += `<div class="section-header" style="margin-top:16px"><span class="section-title">Répartition par app</span></div>`;
      APPS.filter(a=>at[a.val]>0).forEach(a => {

        html += `<div class="app-card">

  else if (tabActif === "histo") {
    // Grouper par date et trier
    const byDate = {};
    courses.forEach(c => {
