<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#fbbf24"/>
  <title>CaisseX — Vue Patron</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: #0f172a; color: #e2e8f0; font-family: -apple-system, 'Segoe UI', sans-serif; padding-top: env(safe-area-inset-top); }
    #app { max-width: 520px; margin: 0 auto; min-height: 100dvh; padding-bottom: 30px; }

    header { background: linear-gradient(135deg, #1e293b, #0f172a); padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; }
    .logo { font-size: 26px; }
    .app-name { font-size: 18px; font-weight: 800; color: #fbbf24; }
    .app-sub { font-size: 11px; color: #64748b; }
    .badge-patron { background: #7c3aed; color: #fff; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; }

    .sync-bar { background: #1e293b; padding: 8px 20px; font-size: 12px; color: #64748b; display: flex; justify-content: space-between; align-items: center; }
    .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; display: inline-block; margin-right: 5px; }

    main { padding: 16px; }
    .section-title { font-size: 12px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }

    .cards-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .stat-card { background: #1e293b; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 4px; }
    .stat-icon { font-size: 20px; }
    .stat-value { font-size: 18px; font-weight: 800; }
    .stat-label { font-size: 10px; color: #64748b; font-weight: 600; }

    .date-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; margin-top: 20px; }
    .date-input { background: #1e293b; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0; padding: 6px 10px; font-size: 13px; }

    .course-card { background: #1e293b; border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .course-left { flex: 1; }
    .course-heure { font-size: 13px; font-weight: 700; color: #94a3b8; margin-bottom: 2px; }
    .course-route { font-size: 14px; font-weight: 600; color: #e2e8f0; margin-bottom: 2px; }
    .course-note { font-size: 12px; color: #64748b; margin-top: 2px; }
    .course-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .course-montant { font-size: 17px; font-weight: 800; color: #fbbf24; }
    .course-paiement { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px; text-transform: uppercase; }
    .app-tag { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px; }

    .empty { color: #475569; text-align: center; padding: 40px 20px; font-size: 14px; line-height: 1.8; }
    .loading { color: #64748b; text-align: center; padding: 60px 20px; font-size: 14px; }

    .recap-box { background: #0f172a; border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 8px; }
    .recap-item { display: flex; justify-content: space-between; font-size: 14px; color: #94a3b8; }

    .tabs { display: flex; gap: 4px; margin-bottom: 16px; }
    .tab { flex: 1; padding: 9px 4px; background: #1e293b; border: 1px solid #334155; border-radius: 10px; color: #64748b; font-size: 12px; font-weight: 600; cursor: pointer; text-align: center; }
    .tab.active { background: #fbbf24; color: #0f172a; border-color: #fbbf24; }

    .app-row-stat { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #1e293b; }
    .app-row-stat:last-child { border-bottom: none; }
  </style>
</head>
<body>
<div id="app">
  <header>
    <div style="display:flex;align-items:center;gap:12px">
      <span class="logo">🚕</span>
      <div>
        <div class="app-name">CaisseX</div>
        <div class="app-sub">Vue Patron</div>
      </div>
    </div>
    <span class="badge-patron">👁️ Lecture seule</span>
  </header>

  <div class="sync-bar">
    <span><span class="sync-dot" id="sync-dot"></span><span id="sync-status">Chargement...</span></span>
    <span id="sync-time"></span>
  </div>

  <main id="main">
    <div class="loading">⏳ Chargement des données...</div>
  </main>
</div>

<script>
const FIREBASE_URL = "https://caissex-3d4cc-default-rtdb.europe-west1.firebasedatabase.app";
let courses = [];
let tabActif = "jour";
let dateFiltre = today();

function today() {
  const now = new Date();
  if (now.getHours() < 8) {
    const hier = new Date(now);
    hier.setDate(now.getDate() - 1);
    return `${hier.getFullYear()}-${String(hier.getMonth()+1).padStart(2,"0")}-${String(hier.getDate()).padStart(2,"0")}`;
  }
  return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;
}

function formatEuro(n) {
  return new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR" }).format(n || 0);
}

function paiementColor(p) {
  return p === "espèces" ? "#4ade80" : p === "carte" ? "#60a5fa" : "#facc15";
}

function appColor(a) {
  return a === "bolt" ? "#34d399" : a === "heetch" ? "#f472b6" : a === "uber" ? "#94a3b8" : a === "taxisvert" ? "#4ade80" : "#fbbf24";
}
function appLabel(a) {
  return a === "bolt" ? "⚡ Bolt" : a === "heetch" ? "🟣 Heetch" : a === "uber" ? "⬛ Uber" : a === "taxisvert" ? "🟢 Taxis Verts" : "🚕 Compteur";
}

function totaux(liste) {
  return liste.reduce((acc, c) => {
    const m = parseFloat(c.montant) || 0;
    acc.total += m; acc.nb++;
    if (c.paiement === "espèces") acc.especes += m;
    else if (c.paiement === "carte") acc.carte += m;
    else acc.autre += m;
    return acc;
  }, { total: 0, especes: 0, carte: 0, autre: 0, nb: 0 });
}

function appTotaux(liste) {
  const apps = ["compteur","bolt","heetch","uber","taxisvert"];
  const res = {};
  apps.forEach(a => res[a] = liste.filter(c => (c.appli||"compteur") === a).reduce((s,c) => s+(parseFloat(c.montant)||0), 0));
  return res;
}

function getMoisListe() {
  const now = new Date();
  const moisStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;
  return courses.filter(c => c.date.startsWith(moisStr));
}

function getSemaineListe() {
  const now = new Date();
  const day = now.getDay();
  const diffLun = (day === 0 ? -6 : 1 - day);
  const lun = new Date(now); lun.setDate(now.getDate() + diffLun);
  const dim = new Date(lun); dim.setDate(lun.getDate() + 6);
  const lunStr = `${lun.getFullYear()}-${String(lun.getMonth()+1).padStart(2,"0")}-${String(lun.getDate()).padStart(2,"0")}`;
  const dimStr = `${dim.getFullYear()}-${String(dim.getMonth()+1).padStart(2,"0")}-${String(dim.getDate()).padStart(2,"0")}`;
  return courses.filter(c => c.date >= lunStr && c.date <= dimStr);
}

function render() {
  const coursesJour = courses.filter(c => c.date === dateFiltre);
  const coursesJourSorted = [...coursesJour].sort((a,b) => b.heure.localeCompare(a.heure));
  const tJour = totaux(coursesJour);
  const tSemaine = totaux(getSemaineListe());
  const tMois = totaux(getMoisListe());
  const appJour = appTotaux(coursesJour);
  const apps = ["compteur","bolt","heetch","uber","taxisvert"];

  let html = `
    <!-- Stats globales -->
    <div class="cards-grid">
      <div class="stat-card" style="border-top:3px solid #fbbf24"><div class="stat-icon">📅</div><div class="stat-value" style="color:#fbbf24">${formatEuro(tJour.total)}</div><div class="stat-label">Aujourd'hui</div></div>
      <div class="stat-card" style="border-top:3px solid #60a5fa"><div class="stat-icon">📆</div><div class="stat-value" style="color:#60a5fa">${formatEuro(tSemaine.total)}</div><div class="stat-label">Cette semaine</div></div>
      <div class="stat-card" style="border-top:3px solid #a78bfa"><div class="stat-icon">🗓️</div><div class="stat-value" style="color:#a78bfa">${formatEuro(tMois.total)}</div><div class="stat-label">Ce mois</div></div>
      <div class="stat-card" style="border-top:3px solid #4ade80"><div class="stat-icon">🚗</div><div class="stat-value" style="color:#4ade80">${courses.length}</div><div class="stat-label">Total courses</div></div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <div class="tab ${tabActif==="jour"?"active":""}" onclick="tabActif='jour';render()">📅 Journée</div>
      <div class="tab ${tabActif==="apps"?"active":""}" onclick="tabActif='apps';render()">📱 Par app</div>
      <div class="tab ${tabActif==="toutes"?"active":""}" onclick="tabActif='toutes';render()">📋 Tout voir</div>
    </div>
  `;

  if (tabActif === "jour") {
    html += `
      <div class="date-row">
        <span class="section-title">Journée du</span>
        <input type="date" class="date-input" value="${dateFiltre}" onchange="dateFiltre=this.value;render()">
      </div>
      <div class="recap-box">
        <div class="recap-item"><span>Total</span><strong style="color:#fbbf24">${formatEuro(tJour.total)}</strong></div>
        <div class="recap-item"><span>Courses</span><strong>${tJour.nb}</strong></div>
        <div class="recap-item"><span>💵 Espèces</span><strong style="color:#4ade80">${formatEuro(tJour.especes)}</strong></div>
        <div class="recap-item"><span>💳 Carte</span><strong style="color:#60a5fa">${formatEuro(tJour.carte)}</strong></div>
      </div>
      ${coursesJourSorted.length === 0
        ? `<div class="empty">Aucune course pour cette journée.</div>`
        : coursesJourSorted.map(c => renderCard(c)).join("")}
    `;
  }

  else if (tabActif === "apps") {
    html += `
      <div class="section-title">Répartition par application — aujourd'hui</div>
      <div class="recap-box" style="margin-bottom:20px">
        ${apps.map(a => appJour[a] > 0 ? `
          <div class="app-row-stat">
            <span style="color:${appColor(a)};font-weight:700">${appLabel(a)}</span>
            <strong style="color:${appColor(a)}">${formatEuro(appJour[a])}</strong>
          </div>` : "").join("") || '<span style="font-size:13px;color:#475569">Aucune course aujourd\'hui</span>'}
      </div>
      <div class="section-title">Répartition par application — ce mois</div>
      <div class="recap-box">
        ${apps.map(a => {
          const v = appTotaux(getMoisListe())[a];
          return v > 0 ? `
            <div class="app-row-stat">
              <span style="color:${appColor(a)};font-weight:700">${appLabel(a)}</span>
              <strong style="color:${appColor(a)}">${formatEuro(v)}</strong>
            </div>` : "";
        }).join("") || '<span style="font-size:13px;color:#475569">Aucune course ce mois</span>'}
      </div>
    `;
  }

  else if (tabActif === "toutes") {
    const triees = [...courses].sort((a,b) => b.date.localeCompare(a.date) || b.heure.localeCompare(a.heure));
    html += `
      <div class="section-title" style="margin-bottom:12px">${courses.length} courses au total</div>
      ${triees.length === 0
        ? `<div class="empty">Aucune course enregistrée.</div>`
        : triees.map(c => renderCard(c)).join("")}
    `;
  }

  document.getElementById("main").innerHTML = html;
}

function renderCard(c) {
  const route = c.depart || c.arrivee
    ? (c.depart || "") + (c.depart && c.arrivee ? " → " : "") + (c.arrivee || "")
    : "Trajet non renseigné";
  const pc = paiementColor(c.paiement);
  const ac = appColor(c.appli || "compteur");
  const al = appLabel(c.appli || "compteur");
  return `
    <div class="course-card">
      <div class="course-left">
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:2px">
          <div class="course-heure">${c.date} · ${c.heure}</div>
        </div>
        <div class="course-route">${route}</div>
        <div style="margin-top:4px"><span class="app-tag" style="background:${ac}22;color:${ac}">${al}</span></div>
        ${c.note ? `<div class="course-note">${c.note}</div>` : ""}
      </div>
      <div class="course-right">
        <div class="course-montant">${parseFloat(c.montant).toFixed(2)} €</div>
        <div class="course-paiement" style="background:${pc}22;color:${pc}">${c.paiement}</div>
      </div>
    </div>`;
}

// Chargement depuis Firebase
async function load() {
  try {
    const res = await fetch(FIREBASE_URL + "/courses.json");
    const data = await res.json();
    if (data && Array.isArray(data)) {
      courses = data;
    }
    document.getElementById("sync-status").textContent = "Synchronisé";
    document.getElementById("sync-dot").style.background = "#4ade80";
    document.getElementById("sync-time").textContent = new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
    render();
  } catch(e) {
    document.getElementById("sync-status").textContent = "Erreur de connexion";
    document.getElementById("sync-dot").style.background = "#f87171";
    document.getElementById("main").innerHTML = `<div class="empty">❌ Impossible de charger les données.<br>Vérifiez votre connexion.</div>`;
  }
}

load();
// Rafraîchissement automatique toutes les 60 secondes
setInterval(load, 60000);
</script>
</body>
</html>
